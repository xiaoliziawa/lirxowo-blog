server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ^~ /ai-radar-data/ {
        expires 1m;
        add_header Cache-Control "public, max-age=60";
        types { application/json json; }
        try_files $uri =404;
    }

    location ^~ /bing/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|mp3)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /robots.txt {
        expires 1h;
    }

    error_page 404 /404.html;
}
