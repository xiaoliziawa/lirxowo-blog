server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ^~ /ai-radar-data/ {
        expires 1m;
        add_header Cache-Control "public, max-age=60";
        types { application/json json; }
        try_files $uri =404;
    }

    # public/ 下的资源路径固定、无内容哈希，不能用 immutable，否则改了 30 天不生效
    # 目录列表由 nginx 直接生成，浏览器据此得到曲目清单；必须短缓存，否则新歌看不见
    location = /music/ {
        autoindex on;
        autoindex_format json;
        expires 1m;
        add_header Cache-Control "public, max-age=60";
    }

    location ^~ /music/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ^~ /assets/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ^~ /bing/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|mp3)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /robots.txt {
        expires 1h;
    }

    error_page 404 /404.html;
}
